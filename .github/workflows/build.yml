
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Gradle Project
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts bulunamadı!"
            find . -maxdepth 4 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Proje bulundu: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
